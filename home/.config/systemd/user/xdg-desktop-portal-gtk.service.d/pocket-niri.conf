# glasstty: GTK4 apps on Wayland read their settings (icon theme
# included) from the Settings portal, not from dconf. This hands the portal the
# niri dconf profile (dconf-niri.sh) while niri runs. The env file exists only
# then: niri.service creates it at start and deletes it at stop, restarting this
# service both times, so under GNOME it is absent and nothing changes.
[Service]
EnvironmentFile=-%h/.config/pocket-dots/dconf/env
