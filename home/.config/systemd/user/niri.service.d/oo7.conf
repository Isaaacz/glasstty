# glasstty: start the oo7 secret service with niri.
#
# Fedora 45 keeps passwords in oo7 (~/.local/share/keyrings/v1/login.keyring).
# At login, GDM's PAM (pam_oo7 in /usr/lib/pam.d/gdm-password) hands the
# password to oo7-daemon-login, which waits up to 120 s for oo7-daemon to
# connect and unlock the keyring. GNOME's session starts oo7-daemon; niri does
# not, so the first app asking for secrets (Brave) got the OLD gnome-keyring by
# D-Bus activation, which does not know the oo7 keyring and offers to create a
# new "Default Keyring". Pulling oo7-daemon in with niri.service fixes it, for
# the niri session only (GNOME does not use niri.service).
[Unit]
Wants=oo7-daemon.service
After=oo7-daemon.service
