# glasstty: theme environment for the niri session only.
#
# ExecStartPre builds a dconf profile that gives niri's apps the icon theme in
# the wallpaper's colours (dconf-niri.sh) and writes DCONF_PROFILE to the env
# file only if that profile works; the "-" makes everything optional. The
# Settings portals read the same env file (their pocket-niri.conf drop-ins), so
# they are restarted to pick it up, and again at stop once it is gone.
#
# When niri exits, also drop the theme variables config.kdl puts in the
# session's activation environment (dbus-update-activation-environment), so
# they never leak into a GNOME session started later on the same user manager.
[Service]
ExecStartPre=-%h/.config/glasstty/scripts/dconf-niri.sh
ExecStartPre=-/usr/bin/systemctl --user try-restart xdg-desktop-portal-gnome.service xdg-desktop-portal-gtk.service
EnvironmentFile=-%h/.config/pocket-dots/dconf/env
ExecStopPost=-/usr/bin/rm -f %h/.config/pocket-dots/dconf/env
ExecStopPost=-/usr/bin/systemctl --user unset-environment GTK_THEME QT_QPA_PLATFORMTHEME DCONF_PROFILE
ExecStopPost=-/usr/bin/systemctl --user try-restart xdg-desktop-portal-gnome.service xdg-desktop-portal-gtk.service
