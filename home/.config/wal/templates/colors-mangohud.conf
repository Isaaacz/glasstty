# MangoHud config generated by pywal from ~/.config/wal/templates/colors-mangohud.conf
# Edit the template, not ~/.cache/wal/colors-mangohud.conf (it is rewritten on every wal run).
# Overlay toggle moved to Right Ctrl + Right Shift + F12: hiding it also stops the log the bar reads.

### glasstty game mode: the stats live in the Quickshell bar, not over the game.
# quickshell/scripts/gamestats.sh reads the newest CSV. The overlay is drawn
# FULLY TRANSPARENT instead of hidden: `no_display` also stops the logger, so
# with it the bar never gets a number. To see the
# overlay over the game, set alpha=1.0 and background_alpha=0.45 below.
alpha=0.0
autostart_log=1
log_interval=500
output_folder=~/.var/app/com.valvesoftware.Steam/cache/mangohud

### Layout (when shown): compact glass panel, matching the rice
position=top-left
offset_x=12
offset_y=12
horizontal
hud_compact
round_corners=12
background_alpha=0.0
font_size=18
# Host fonts are mounted at /run/host/fonts inside the Steam Flatpak
font_file=/run/host/fonts/rsms-inter-fonts/Inter-SemiBold.ttf
table_columns=3
toggle_hud=Control_R+Shift_R+F12

### What is shown
fps
frametime
frame_timing
cpu_stats
cpu_temp
cpu_load_change
gpu_stats
gpu_load_change
ram
fps_color_change
fps_value=30,60

### Colours (pywal)
background_color={background.strip}
text_color={foreground.strip}
cpu_color={color4.strip}
gpu_color={color6.strip}
ram_color={color3.strip}
vram_color={color3.strip}
engine_color={color5.strip}
frametime_color={color2.strip}
media_player_color={foreground.strip}
cpu_load_color={color7.strip},{color4.strip},{color5.strip}
gpu_load_color={color7.strip},{color6.strip},{color5.strip}
fps_color={color5.strip},{color4.strip},{color7.strip}
