# pywal -> ~/.cache/wal/thyx-colors.conf
# The colour keys of the thyx login theme (SDDM) and of the lock screen, taken
# from the wallpaper. login-pywal.sh merges them over the chosen thyx preset.
DateTextColor="{color7}"
TimeTextColor="{color15}"
FormBackgroundColor="{background}"
LoginFieldBackgroundColor="{color4}"
PasswordFieldBackgroundColor="{color4}"
LoginFieldTextColor="{foreground}"
PasswordFieldTextColor="{foreground}"
PlaceholderTextColor="{color8}"
LoginButtonTextColor="{background}"
LoginButtonBackgroundColor="{color4}"
HoverLoginButtonBackgroundColor="{color6}"
SystemButtonsIconsColor="{color7}"
HoverSystemButtonsIconsColor="{color4}"
EnvironmentButtonTextColor="{color7}"
HoverEnvironmentButtonTextColor="{color4}"
DropdownTextColor="{foreground}"
DropdownSelectedTextColor="{background}"
DropdownBackgroundColor="{background}"
DropdownSelectedBackgroundColor="{color4}"
DropdownBorderColor="{color8}"
DropdownSelectedBorderColor="{color6}"
StartupBackgroundColor="{background}"
