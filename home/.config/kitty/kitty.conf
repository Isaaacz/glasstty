# kitty — pocket-dots (niri / Fedora)
#
# Translucent over the wallpaper, blurred by niri behind it (window-rule in
# ~/.config/niri/config.kdl), with pywal colours whose contrast against the
# background is guaranteed by ~/.config/glasstty/scripts/kitty-contrast.py.

# ── font ──
# JetBrains Mono from Fedora; the icons (Nerd Font glyphs) come from Symbols
# Nerd Font by fallback, no patched font needed.
font_family        JetBrains Mono
bold_font          JetBrains Mono ExtraBold
italic_font        auto
bold_italic_font   auto
font_size          11
# Slightly thicker strokes: thin text is the first thing to vanish on a
# translucent background.
text_composition_strategy 1.2 10

# ── transparency ──
# 0.85: the wallpaper shows through, blurred by niri, and the text keeps a solid
# enough backdrop. Ctrl+Shift+A then M / L changes it live.
background_opacity         0.85
dynamic_background_opacity yes

# ── window ──
hide_window_decorations yes
window_padding_width    10
confirm_os_window_close 0
remember_window_size    no
enable_audio_bell       no
sync_to_monitor         no

# ── cursor ──
cursor_shape                 block
cursor_blink_interval        0.6
cursor_trail                 20
cursor_trail_decay           0.02 0.13
cursor_trail_start_threshold 0

# ── misc ──
url_style        curly
shell_integration enabled
# Optional bits switched on in Settings › System › Terminal (glasstty writes
# them there). One today: a command that ran 15 s or more while the window was
# not focused sends a notification when it ends, and it pops out of the notch.
include ${HOME}/.local/state/glasstty/kitty.conf
scrollback_lines 10000
scrollbar_handle_opacity 0
scrollbar_track_opacity  0
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# ── tabs ──
tab_bar_style      powerline
tab_powerline_style slanted
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

# ── colours: pywal, contrast-checked (regenerated at every wallpaper change).
#    If missing (first boot), kitty keeps its defaults and says nothing.
include ~/.cache/wal/colors-kitty-contrast.conf
